spring.application.name=SmartContractMonitor

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/observer_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=smart-contract-monitor
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.org.springframework.kafka=DEBUG

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8082}

# JWT
jwt.secret=${JWT_SECRET}